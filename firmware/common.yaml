packages:
  network: !include {file: network.yaml, vars: {fallback_ap_ssid: "Controlleur-Seche-Serviettes"}}

esphome:
  name: controlleur-seche-serviettes
  friendly_name: Controlleur sèche-serviettes

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

wifi:
  # The super mini chip antenna is poorly matched: lower TX power keeps the link stable
  output_power: 8.5dB

light:
  - platform: status_led
    name: Status LED
    pin:
      number: GPIO8
      inverted: true

[package]
name         = "mitm"
version      = "0.0.0"
edition      = "2024"
rust-version = "1.95"
description  = "ESP32-C3 in the middle of the Linap bus of the Sauter Marapi radiator, linked to Home Assistant over MQTT"
license      = "MIT"
publish      = false

[[bin]]
name = "mitm"
path = "./src/bin/main.rs"

[dependencies]
linap = { path = "../linap" }

esp-hal                = { version = "~1.2.2", features = ["esp32c3", "log-04", "unstable"] }
esp-rtos               = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32c3", "log-04"] }
esp-radio              = { version = "1.0.0-beta.1", features = ["esp-alloc", "esp32c3", "log-04", "unstable", "wifi"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3", "log-04"] }
esp-alloc              = { version = "0.11.0", features = ["esp32c3"] }
esp-backtrace          = { version = "0.20.0", features = ["esp32c3", "panic-handler", "println"] }
esp-println            = { version = "0.18.0", default-features = false, features = ["colors", "critical-section", "esp32c3", "jtag-serial", "log-04"] }

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-futures  = "0.1.2"
embassy-net      = { version = "0.9.1", features = ["dhcpv4", "log", "medium-ethernet", "tcp"] }
embassy-sync     = "0.8.0"
embassy-time     = { version = "0.5.0", features = ["log"] }
rust-mqtt        = { version = "0.6.0", default-features = false, features = ["v5", "alloc"] }

critical-section = "1.2.0"
enumset          = "1.1.15"
log              = "0.4.27"
static_cell      = "2.1.1"

[profile.dev]
# The default debug profile is too slow and too big for the chip
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"

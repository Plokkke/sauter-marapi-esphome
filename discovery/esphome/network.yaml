# Logs, Home Assistant API, OTA and Wi-Fi shared by every firmware of this repository.
# Include with: !include {file: network.yaml, vars: {fallback_ap_ssid: "..."}}
logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${fallback_ap_ssid}
    password: !secret fallback_ap_password

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
    update_interval: 60s
